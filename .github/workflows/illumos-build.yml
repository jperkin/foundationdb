name: illumos-build

on:
  push:
    branches: [ 'illumos-*' ]
    # release tags are prefixed to stay clear of upstream FDB version tags.
    tags: [ 'illumos-v*' ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run ctest after building
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-illumos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # 5.0.1

      - name: Build FoundationDB in OmniOS VM
        uses: vmactions/omnios-vm@7f2be0b927aad1a78498c8aeeac4c4ce1fabd322 # v1.3.3
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
        with:
          release: r151058
          mem: 12288
          envs: "RUN_TESTS"
          prepare: |
            pkg install build-essential developer/build/onbld developer/versioning/git \
              ooce/developer/cmake ooce/developer/ninja \
              runtime/python-313 library/python-3/setuptools-313 \
              library/security/openssl-3 library/zlib
            # illumos does not overcommit memory: gcc VA peaks on the heavy
            # TUs must be backed by RAM+swap, and the image has little swap
            # for a 12 GB VM.
            swap -sh
            zfs create -V 8G rpool/swap2
            swap -a /dev/zvol/dsk/rpool/swap2
            swap -sh
            # clamp the ARC to 512M: pageout to a zvol fights ARC eviction
            # and can livelock the guest (runs 29047171702, 29093312577 died
            # unresponsive mid-swap). arc_c/arc_c_max are arc_stats members,
            # not symbols, so resolve their addresses for the mdb write.
            for m in arcstat_c arcstat_c_max; do
              addr=$(echo "arc_stats::print -a arc_stats_t $m.value.ui64" | mdb -k | awk '{print $1}')
              echo "$addr/Z 0x20000000" | mdb -kw
            done
            echo 'arc_stats::print -d arc_stats_t arcstat_c.value.ui64 arcstat_c_max.value.ui64' | mdb -k
          # Build outside the workspace so copyback only returns out/.
          run: |
            set -e
            export CC=/opt/gcc-14/bin/gcc CXX=/opt/gcc-14/bin/g++
            # cmake/ninja from ooce, ctfconvert from onbld
            export PATH=/opt/ooce/bin:/opt/onbld/bin/i386:$PATH
            # bundled sub-projects still declare cmake_minimum_required < 3.5
            export CMAKE_POLICY_VERSION_MINIMUM=3.5
            SRC=$PWD

            mkdir -p /var/tmp/build && cd /var/tmp/build
            # OmniOS ships shared-only OpenSSL; no static libssl/libcrypto exist
            # -g0 experiment: full-DWARF compiles exceed this VM, see run
            # 29075418181
            cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DSSD_ROCKSDB_EXPERIMENTAL=OFF \
                -DENABLE_SIMULATION_TESTS=ON -DOPENSSL_USE_STATIC_LIBS=FALSE \
                -DBUILD_DOCUMENTATION=OFF -DSUNOS_DEBUG_FLAG=-g0 \
                "$SRC"
            # 'packages' runs the strip -x pipeline whose output the TGZ
            # install rules package.
            # -j2: the giant Blob*.actor.g.cpp TUs are alphabetically adjacent
            # and co-scheduled; three at once exceed RAM at any -g level and
            # paging kills the guest (runs 29093312577, 29097539037, 29106680200)
            ninja -j2 all packages
            # InstallLayout.cmake pins CPACK_OUTPUT_FILE_PREFIX to
            # $BUILD/packages; cpack -B cannot move it
            cpack -G TGZ
            mkdir -p "$SRC/out"
            cp packages/foundationdb-*.tar.gz* "$SRC/out/"

            if [ "$RUN_TESTS" = "true" ]; then
              ctest --output-on-failure -j2
            fi

      - name: Upload artifact
        # upload what was built even if the opt-in test run failed
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # 4.6.1
        with:
          name: foundationdb-illumos
          path: out/*
          retention-days: 30
          if-no-files-found: error

      - name: Attach to release (tags)
        if: startsWith(github.ref, 'refs/tags/illumos-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "$GITHUB_REF_NAME" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
